[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dt_sim"
version = "0.1.0"
description = "Dynamic tasking simulator for agile EO satellites"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dt_sim = ["py.typed"]
